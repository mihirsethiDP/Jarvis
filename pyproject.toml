[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Jarvis — internal voice assistant for daily operations, with a security-first tool layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.119.0,<1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "keyring>=25.0,<26",
    "google-api-python-client>=2.100",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.1",
    "google-auth-httplib2>=0.2",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
voice = [
    "openwakeword==0.6.0",
    "onnxruntime>=1.16.1,<2",
    "faster-whisper>=1.0,<2",
    "sounddevice>=0.4.6",
    "silero-vad>=5.1",
    "numpy>=1.24,<3",
    "pyttsx3>=2.90",
]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["defaults.yaml", "ui/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
