# Jarvis default configuration (shipped inside the package).
# Per-user overrides live at  %APPDATA%\Jarvis\config.yaml  (same structure —
# only the keys you want to change). Nothing in this file is a secret.

assistant:
  name: Jarvis
  # When true, skip the microphone entirely and run as a console chat.
  text_mode: false

brain:
  model: claude-opus-4-8
  # low | medium | high — voice interactions favor low (terse, fast).
  effort: low
  max_tokens: 4096
  # How many previous exchanges to keep in the conversation window.
  max_history_turns: 20

audio:
  input_device: null        # null = system default microphone
  sample_rate: 16000
  wake:
    engine: openwakeword    # openwakeword (offline, free)
    model: hey_jarvis       # pretrained openWakeWord model
    threshold: 0.5
  stt:
    engine: faster-whisper  # faster-whisper (offline) | google (online)
    model_size: base.en     # tiny.en | base.en | small.en ... (use "small" for Hindi)
    compute_type: int8
    # "en" | "hi" | ... | "auto" (detect per utterance — best for Hinglish).
    # Anything but "en" auto-upgrades a ".en" model to its multilingual twin.
    language: en
    max_seconds: 20         # hard cap on a single utterance
    silence_seconds: 1.2    # end of speech after this much silence
  tts:
    # pyttsx3: offline Windows SAPI voices (private, robotic).
    # edge: Microsoft neural voices incl. Hindi/Hinglish — natural, but CLOUD:
    #       spoken replies are sent to Microsoft for synthesis (see SECURITY.md).
    engine: pyttsx3         # pyttsx3 | edge
    voice: null             # pyttsx3: substring of an installed SAPI voice name
    rate: 180
    edge_voice_en: en-IN-NeerjaNeural   # used for English/Hinglish replies
    edge_voice_hi: hi-IN-SwaraNeural    # used when the reply is in Devanagari

google:
  # Path to the OAuth client secrets JSON for the company's *internal* Google
  # Cloud app (Desktop type). Internal apps skip Google's verification review.
  credentials_file: ""
  # Least privilege per app, still broad enough to "service" it properly:
  #   drive.file            — read/write files Jarvis created or the user picked
  #   drive.readonly        — search/fetch existing company documents
  #   gmail.modify           — read, send, archive, label, trash mail (superset
  #                            of send+readonly+labels; excludes permanent
  #                            delete and Settings — see docs/SECURITY.md)
  #   chat.spaces.readonly   — list the employee's own Chat spaces/DMs
  #   chat.messages.readonly — read messages in spaces the employee belongs to
  #   chat.messages.create   — send a Chat message as the employee
  #   calendar.readonly      — view events and check free/busy
  #   calendar.events        — create/update/delete events (invites confirmed)
  #   directory.readonly     — look up a colleague's email/phone by name
  #                            (needs a Workspace-admin setting — see below)
  #
  # NOTE: if employees already authorized Jarvis under an older/smaller scope
  # list, expanding this list does NOT retroactively upgrade their stored
  # token — each employee must re-run `jarvis setup-google` once.
  scopes:
    - https://www.googleapis.com/auth/drive.file
    - https://www.googleapis.com/auth/drive.readonly
    - https://www.googleapis.com/auth/gmail.modify
    - https://www.googleapis.com/auth/chat.spaces.readonly
    - https://www.googleapis.com/auth/chat.messages.readonly
    - https://www.googleapis.com/auth/chat.messages.create
    - https://www.googleapis.com/auth/calendar.readonly
    - https://www.googleapis.com/auth/calendar.events
    - https://www.googleapis.com/auth/directory.readonly

files:
  # Local directories Jarvis may read from / write to. Anything outside these
  # is refused at the tool layer regardless of what the model asks for.
  allowed_dirs:
    - "~/Documents"
    - "~/Downloads"

# External AI tools Jarvis may forward prompts to — only if listed here AND
# the user grants permission at runtime. Example:
#   - name: company-gpt
#     kind: openai-compatible     # openai-compatible | anthropic
#     base_url: https://llm.internal.example.com/v1
#     model: gpt-4o
#     api_key_env: COMPANY_GPT_API_KEY
ai_tools: []

# Company-internal tools Jarvis may read context from / act on — AS THE
# SIGNED-IN EMPLOYEE. Each employee connects with their own token
# (`jarvis secrets set tool-<name>-token`); the tool's server-side permissions
# decide what that account can access. Jarvis never gets database credentials.
# Example:
#   - name: plantops
#     description: the PlantOps dashboard
#     base_url: https://plantops.internal.digitalpaani.com/api
#     auth: bearer                # bearer (per-user token) | none
#     actions:
#       - name: search_tickets
#         kind: read              # read | write (write = confirmed per action)
#         method: GET
#         path: /tickets
#         description: search maintenance tickets by text
#         params:
#           query: {type: string, in: query, description: search text}
#       - name: create_ticket
#         kind: write
#         method: POST
#         path: /tickets
#         description: open a new maintenance ticket
#         params:
#           title:    {type: string, in: body, description: short ticket title}
#           plant_id: {type: string, in: body, description: plant identifier}
internal_tools: []

security:
  # Note: side-effect confirmation (spoken summary + explicit "yes") is always
  # on and deliberately has no config switch.
  # "Allow for this session" grants expire after this many minutes.
  session_grant_minutes: 480

ui:
  enabled: false
  port: 8763   # always bound to 127.0.0.1 (loopback only, not configurable)
