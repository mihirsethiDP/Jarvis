<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jarvis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --idle: #2a7fff; --listening: #16e0c8; --transcribing: #f5c542;
    --thinking: #a970ff; --speaking: #ff7847; --offline: #555;
    --bg0: #0b1020; --bg1: #05070d; --ink: #cfd8ea; --dim: #7b88a3;
    --line: #1c2740; --warn: #ff6b6b; --good: #45d18a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at 30% 0%, var(--bg0) 0%, var(--bg1) 70%);
    min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--ink); display: grid; grid-template-columns: 1fr 1fr;
    gap: 2rem; padding: 2rem; align-items: center;
  }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; } }

  /* ── left: the orb ── */
  .stage { display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 1.6rem; }
  h1 { font-weight: 300; font-size: 1rem; letter-spacing: .45em;
       text-transform: uppercase; }
  .orb-wrap { position: relative; width: 220px; height: 220px; }
  .orb, .ring, .halo { position: absolute; inset: 0; border-radius: 50%; }
  .orb {
    inset: 46px;
    background: radial-gradient(circle at 35% 30%, #ffffffcc 0%, var(--c, var(--idle)) 28%, #060a14 95%);
    box-shadow: 0 0 60px 8px var(--c, var(--idle));
    transition: box-shadow .6s ease; animation: breathe 3.2s ease-in-out infinite;
  }
  .ring { border: 1px solid color-mix(in srgb, var(--c, var(--idle)) 55%, transparent);
          animation: spin 14s linear infinite; }
  .ring::before { content: ""; position: absolute; top: -4px; left: 50%;
    width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--idle));
    box-shadow: 0 0 12px var(--c, var(--idle)); }
  .ring.r2 { inset: 20px; animation-duration: 9s; animation-direction: reverse; opacity: .7; }
  .halo { inset: -26px; background: radial-gradient(circle,
          color-mix(in srgb, var(--c, var(--idle)) 16%, transparent) 0%, transparent 70%);
          animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  body[data-state="listening"] .orb { animation-duration: 1.1s; }
  body[data-state="thinking"] .ring { animation-duration: 3.5s; }
  body[data-state="speaking"] .orb  { animation-duration: 0.8s; }
  body[data-state="offline"] .orb, body[data-state="offline"] .ring { animation-play-state: paused; }
  #state { font-size: 1.35rem; font-weight: 600; letter-spacing: .06em;
           color: var(--c, var(--idle)); transition: color .4s; }
  #detail { max-width: 420px; text-align: center; opacity: .55; font-size: .88rem;
            min-height: 1.2em; padding: 0 1rem; }

  /* ── right: activity ── */
  .panel { background: #070b16aa; border: 1px solid var(--line); border-radius: 14px;
           height: min(78vh, 660px); display: flex; flex-direction: column; }
  .panel header { padding: .9rem 1.1rem; border-bottom: 1px solid var(--line);
                  display: flex; align-items: center; justify-content: space-between; }
  .panel header h2 { font-size: .78rem; font-weight: 600; letter-spacing: .16em;
                     text-transform: uppercase; color: var(--dim); }
  .live { display: flex; align-items: center; gap: .4rem; font-size: .7rem; color: var(--dim); }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good);
            animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  #feed { overflow-y: auto; padding: .5rem; flex: 1; display: flex; flex-direction: column-reverse; }
  .row { display: grid; grid-template-columns: 3.6rem 1fr; gap: .6rem;
         padding: .55rem .6rem; border-radius: 8px; font-size: .84rem; line-height: 1.4; }
  .row:hover { background: #ffffff08; }
  .row .t { font-variant-numeric: tabular-nums; color: var(--dim); font-size: .76rem; }
  .row .what b { font-weight: 600; }
  .row .d { color: var(--dim); font-size: .78rem; word-break: break-word; }
  .row .badge { display: inline-block; font-size: .66rem; letter-spacing: .06em;
                text-transform: uppercase; padding: .1rem .4rem; border-radius: 4px;
                margin-left: .4rem; border: 1px solid var(--line); color: var(--dim); }
  .row.bad .what b { color: var(--warn); }
  .row.bad .badge { color: var(--warn); border-color: var(--warn); }
  .row.confirm .badge { color: var(--thinking); border-color: var(--thinking); }
  .row.ok .badge { color: var(--good); border-color: var(--good); }
  .empty { color: var(--dim); font-size: .82rem; text-align: center; padding: 2rem 1rem; }
  footer { grid-column: 1/-1; text-align: center; opacity: .3; font-size: .68rem;
           letter-spacing: .1em; }
</style>
</head>
<body data-state="idle">
  <div class="stage">
    <h1>Jarvis</h1>
    <div class="orb-wrap"><div class="halo"></div><div class="ring"></div><div class="ring r2"></div><div class="orb"></div></div>
    <div id="state">connecting…</div>
    <div id="detail"></div>
  </div>

  <section class="panel">
    <header>
      <h2>Activity</h2>
      <span class="live"><i></i>live</span>
    </header>
    <div id="feed"><div class="empty">Nothing yet. Actions appear here the moment Jarvis takes them.</div></div>
  </section>

  <footer>DIGITALPAANI · INTERNAL ASSISTANT · 127.0.0.1 ONLY</footer>

<script>
  const colors = { idle:"--idle", listening:"--listening", transcribing:"--transcribing",
                   thinking:"--thinking", speaking:"--speaking", offline:"--offline" };
  const labels = { idle:'say "Hey Jarvis"', listening:"listening…", transcribing:"transcribing…",
                   thinking:"working…", speaking:"speaking", starting:"starting…", offline:"offline" };
  const stateEl = document.getElementById("state");
  const detailEl = document.getElementById("detail");
  const feedEl = document.getElementById("feed");

  function applyState(msg) {
    const s = msg.state || "idle";
    document.body.dataset.state = s;
    const v = getComputedStyle(document.documentElement).getPropertyValue(colors[s] || "--idle");
    document.body.style.setProperty("--c", v);
    stateEl.textContent = labels[s] || s;
    detailEl.textContent = (s === "thinking" && msg.detail) ? "“" + msg.detail + "”" : (msg.detail || "");
  }

  function addActivity(a, prepend) {
    const empty = feedEl.querySelector(".empty");
    if (empty) empty.remove();
    const row = document.createElement("div");
    row.className = "row" + (a.ok === false ? " bad" : "")
      + (a.event === "confirmation" ? " confirm" : "")
      + (a.decision === "confirmed" || a.decision === "ok" ? " ok" : "");
    const badge = a.decision ? `<span class="badge">${a.decision}</span>` : "";
    row.innerHTML =
      `<div class="t">${a.ts || ""}</div>` +
      `<div><div class="what">${a.verb || a.event} <b>${a.tool || ""}</b>${badge}</div>` +
      (a.detail ? `<div class="d">${a.detail.replace(/</g,"&lt;")}</div>` : "") + `</div>`;
    // column-reverse: newest goes first in DOM order
    if (prepend) feedEl.appendChild(row); else feedEl.prepend(row);
  }

  let keepalive = null;
  function connect() {
    if (!location.host) { applyState({state:"offline", detail:"open via the Jarvis status server"}); return; }
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === "snapshot") {
        applyState(m.state || {});
        (m.activity || []).forEach(a => addActivity(a, true));
      } else if (m.type === "activity") {
        addActivity(m, false);
      } else {
        applyState(m);
      }
    };
    ws.onclose = () => { applyState({state:"offline"}); clearInterval(keepalive); setTimeout(connect, 2000); };
    clearInterval(keepalive);
    keepalive = setInterval(() => { if (ws.readyState === 1) ws.send("ping"); }, 20000);
  }
  connect();
</script>
</body>
</html>
