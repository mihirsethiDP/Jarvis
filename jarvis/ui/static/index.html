<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DP Assistant</title>
<style>
  /* == Carbon & Ember ==================================================== */
  :root {
    --carbon-0: #08090b;   /* page floor */
    --carbon-1: #0e1013;   /* panels */
    --carbon-2: #16181d;   /* raised */
    --carbon-3: #22252c;   /* strokes */
    --ember:    #ff6b1a;   /* primary accent */
    --ember-hi: #ffb066;   /* hot highlight */
    --ember-lo: #c33e00;   /* deep coal */
    --ink:      #e8e6e1;   /* primary text */
    --ink-dim:  #8b8f98;   /* secondary text */
    --ink-faint:#565a63;
    --ok:       #57c78a;
    --bad:      #e5484d;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 700px at 50% -10%, #15120e 0%, transparent 60%),
      radial-gradient(900px 500px at 50% 115%, #120d09 0%, transparent 55%),
      var(--carbon-0);
    color: var(--ink);
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  ::selection { background: rgba(255,107,26,.35); }

  /* == Frame ============================================================= */
  #frame { display: grid; grid-template-rows: 52px 1fr auto; height: 100vh; }

  header {
    display: flex; align-items: center; gap: 12px; padding: 0 18px;
    border-bottom: 1px solid rgba(255,255,255,.05);
    background: rgba(14,16,19,.6); backdrop-filter: blur(10px);
  }
  #brand { display: flex; align-items: baseline; gap: 8px; }
  #brand b {
    font-size: 15px; letter-spacing: .35em; font-weight: 650;
    background: linear-gradient(100deg, var(--ink) 30%, var(--ember-hi) 70%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #brand span { color: var(--ink-faint); font-size: 11px; letter-spacing: .12em; }
  #wake-chip {
    margin-left: auto; font-size: 12px; color: var(--ink-dim);
    border: 1px solid var(--carbon-3); border-radius: 999px; padding: 4px 12px;
    background: var(--carbon-1);
  }
  #wake-chip b { color: var(--ember-hi); font-weight: 600; }
  #quit {
    border: 1px solid var(--carbon-3); background: transparent; color: var(--ink-dim);
    border-radius: 999px; padding: 4px 14px; font: inherit; font-size: 12px;
    cursor: pointer; transition: all .15s;
  }
  #quit:hover { border-color: var(--bad); color: var(--bad); }

  /* == Stage ============================================================= */
  #stage {
    display: grid; grid-template-columns: minmax(380px, 46%) 1fr;
    min-height: 0;
  }
  #left {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 6px; padding: 12px; min-height: 0;
    position: relative;
  }
  #orb { width: min(46vh, 92%); aspect-ratio: 1; display: block; }

  /* status capsule under the orb — the "what is it doing" answer */
  #status {
    text-align: center; max-width: 92%;
  }
  #state-label {
    font-size: 21px; font-weight: 600; letter-spacing: .02em;
    transition: color .3s;
  }
  #state-label.asking { color: var(--ember-hi); }
  #state-detail {
    margin-top: 3px; color: var(--ink-dim); font-size: 13px;
    min-height: 20px; max-height: 40px; overflow: hidden;
    text-overflow: ellipsis;
  }
  .dots::after {
    content: ""; display: inline-block; width: 1.4em; text-align: left;
    animation: dots 1.4s steps(4) infinite;
  }
  @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} }

  /* == Right column: conversation + activity =========================== */
  #right {
    display: grid; grid-template-rows: 1fr auto; gap: 0; min-height: 0;
    border-left: 1px solid rgba(255,255,255,.05); background: rgba(10,11,13,.4);
  }
  #convo { overflow-y: auto; padding: 18px 20px 6px; scroll-behavior: smooth; }
  .msg { max-width: 82%; margin: 0 0 10px; padding: 9px 13px; border-radius: 13px;
         white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; }
  .msg.you {
    margin-left: auto; background: linear-gradient(135deg, #33210f, #2a1a0c);
    border: 1px solid rgba(255,107,26,.25); border-bottom-right-radius: 4px;
  }
  .msg.jarvis {
    background: var(--carbon-2); border: 1px solid var(--carbon-3);
    border-bottom-left-radius: 4px;
  }
  .msg .who { display: block; font-size: 10px; letter-spacing: .14em;
              color: var(--ink-faint); margin-bottom: 2px; text-transform: uppercase; }
  .msg.you .who { color: rgba(255,176,102,.6); }

  /* draft card — outgoing content shown before it is sent */
  #draft {
    display: none; margin: 0 0 12px; border-radius: var(--radius);
    border: 1px solid rgba(255,107,26,.4);
    background: linear-gradient(180deg, rgba(255,107,26,.08), rgba(255,107,26,.02));
    overflow: hidden;
  }
  #draft.show { display: block; animation: rise .25s ease-out; }
  #draft-title {
    padding: 9px 14px; font-size: 12px; font-weight: 600; letter-spacing: .06em;
    color: var(--ember-hi); border-bottom: 1px solid rgba(255,107,26,.2);
    background: rgba(255,107,26,.07);
  }
  #draft-body {
    padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere;
    font-size: 13px; color: var(--ink); max-height: 38vh; overflow-y: auto;
  }

  /* the question card — impossible to miss when Jarvis is waiting on you */
  #ask {
    display: none; margin: 0 0 12px; padding: 14px 16px;
    border-radius: var(--radius); border: 1px solid rgba(255,107,26,.55);
    background: linear-gradient(180deg, rgba(255,107,26,.14), rgba(255,107,26,.04));
    box-shadow: 0 0 24px rgba(255,107,26,.12);
  }
  #ask.show { display: block; animation: rise .25s ease-out; }
  #ask-q { font-size: 14px; margin-bottom: 11px; white-space: pre-wrap; }
  #ask .row { display: flex; gap: 8px; }
  #ask button {
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    border-radius: 9px; padding: 7px 22px; transition: transform .1s;
  }
  #ask button:active { transform: scale(.96); }
  #yes { background: var(--ember); border: 1px solid var(--ember-hi); color: #1a0d02; }
  #no  { background: transparent; border: 1px solid var(--carbon-3); color: var(--ink-dim); }
  #ask input {
    flex: 1; font: inherit; font-size: 13px; background: var(--carbon-1);
    border: 1px solid var(--carbon-3); border-radius: 9px; padding: 7px 11px;
    color: var(--ink); outline: none;
  }
  #ask input:focus { border-color: rgba(255,107,26,.5); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

  /* activity ticker */
  #activity {
    border-top: 1px solid rgba(255,255,255,.05); max-height: 148px;
    overflow-y: auto; padding: 8px 20px 10px; font-size: 11.5px;
  }
  #activity h4 {
    font-size: 10px; letter-spacing: .18em; color: var(--ink-faint);
    text-transform: uppercase; margin: 2px 0 6px; position: sticky; top: -8px;
    background: #0b0c0f; padding: 4px 0;
  }
  .act { display: flex; gap: 8px; color: var(--ink-dim); padding: 1.5px 0; }
  .act .ts { color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .act .tool { color: var(--ember-hi); }
  .act.bad .tool { color: var(--bad); }

  /* == Composer ========================================================== */
  #composer {
    display: flex; gap: 10px; align-items: center; padding: 12px 18px 14px;
    border-top: 1px solid rgba(255,255,255,.05);
    background: rgba(14,16,19,.75); backdrop-filter: blur(10px);
  }
  #say {
    flex: 1; resize: none; height: 42px; font: inherit; color: var(--ink);
    background: var(--carbon-1); border: 1px solid var(--carbon-3);
    border-radius: 11px; padding: 10px 14px; outline: none; transition: border .15s;
  }
  #say:focus { border-color: rgba(255,107,26,.45); }
  .btn {
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    border-radius: 11px; padding: 10px 20px; transition: all .15s; border: 1px solid;
  }
  #talk { background: var(--carbon-2); border-color: var(--carbon-3); color: var(--ink); }
  #talk:hover { border-color: rgba(255,107,26,.5); color: var(--ember-hi); }
  #send { background: linear-gradient(135deg, var(--ember), var(--ember-lo));
          border-color: var(--ember); color: #1a0d02; }
  #send:hover { filter: brightness(1.12); }

  #offline-veil {
    display: none; position: fixed; inset: 0; z-index: 30;
    background: rgba(8,9,11,.8); backdrop-filter: blur(4px);
    align-items: center; justify-content: center; color: var(--ink-dim);
    font-size: 15px; flex-direction: column; gap: 8px;
  }
  #offline-veil.show { display: flex; }

  @media (max-width: 900px) {
    #stage { grid-template-columns: 1fr; grid-template-rows: 46% 1fr; }
    #right { border-left: none; border-top: 1px solid rgba(255,255,255,.05); }
    #orb { width: min(38vh, 70%); }
  }
</style>
</head>
<body>
<div id="frame">
  <header>
    <div id="brand"><b>DP&thinsp;ASSISTANT</b><span>DIGITALPAANI</span></div>
    <div id="wake-chip">say <b id="wake">…</b> or press Talk</div>
    <button id="quit">Quit</button>
  </header>

  <div id="stage">
    <div id="left">
      <canvas id="orb"></canvas>
      <div id="status">
        <div id="state-label">Connecting…</div>
        <div id="state-detail"></div>
      </div>
    </div>

    <div id="right">
      <div id="convo">
        <div id="draft">
          <div id="draft-title"></div>
          <div id="draft-body"></div>
        </div>
        <div id="ask">
          <div id="ask-q"></div>
          <div class="row">
            <button id="yes">Yes</button>
            <button id="no">No</button>
            <input id="ask-free" placeholder="…or answer in your own words"
                   autocomplete="off">
          </div>
        </div>
      </div>
      <div id="activity"><h4>Activity</h4><div id="act-list"></div></div>
    </div>
  </div>

  <div id="composer">
    <textarea id="say" placeholder="Type what you need — DP Assistant replies here"></textarea>
    <button id="talk" class="btn">🎙 Talk</button>
    <button id="send" class="btn">Send</button>
  </div>
</div>
<div id="offline-veil"><div>DP Assistant is offline.</div>
  <div style="font-size:12px;color:var(--ink-faint)">Start it from the desktop shortcut — this page reconnects on its own.</div>
</div>

<script>
"use strict";
/* ======================================================================
   Carbon & Ember orb — high-resolution (devicePixelRatio-aware) canvas.
   The orb is the primary state instrument: every state has a distinct
   motion signature, so what Jarvis is doing is readable from across the
   room, before reading a single word.
   ====================================================================== */
const canvas = document.getElementById("orb");
const ctx = canvas.getContext("2d");
let DPR = 1, SIZE = 0;

function fitCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  const css = canvas.clientWidth;               // square via aspect-ratio
  SIZE = Math.max(css, 10);
  canvas.width = Math.round(SIZE * DPR);
  canvas.height = Math.round(SIZE * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);       // draw in CSS pixels, crisp at any DPR
}
new ResizeObserver(fitCanvas).observe(canvas);

/* palette */
const EMBER = "#ff6b1a", EMBER_HI = "#ffb066", EMBER_LO = "#c33e00";
const CARBON_RING = "rgba(120,124,134,0.28)", CARBON_DIM = "rgba(120,124,134,0.13)";

/* per-state motion signature:
   speed  — global rotation multiplier
   energy — glow + core intensity 0..1
   pulse  — breathing amplitude
   sparks — orbiting particles (thinking/working)
   strobe — outer ring flash (asking) */
const MOTION = {
  starting:     { speed: .35, energy: .25, pulse: .35, sparks: 0,  strobe: false },
  idle:         { speed: .22, energy: .30, pulse: .28, sparks: 0,  strobe: false },
  listening:    { speed: .55, energy: .85, pulse: 1.0, sparks: 0,  strobe: false },
  transcribing: { speed: .90, energy: .70, pulse: .55, sparks: 5,  strobe: false },
  thinking:     { speed: 1.5, energy: .75, pulse: .35, sparks: 9,  strobe: false },
  working:      { speed: 1.5, energy: .75, pulse: .35, sparks: 9,  strobe: false },
  asking:       { speed: .45, energy: .95, pulse: .85, sparks: 0,  strobe: true  },
  speaking:     { speed: .70, energy: .90, pulse: .70, sparks: 0,  strobe: false },
  offline:      { speed: .05, energy: .06, pulse: .05, sparks: 0,  strobe: false },
};
let motion = MOTION.starting, motionTarget = MOTION.starting;
let level = { speed:.35, energy:.25, pulse:.35, sparks:0 }; // eased live values

/* ring recipe: [kind, radius0..1, width, count/length, speed, alpha] */
const RINGS = [
  ["ring",  .995, 1.2, 0,   0,    .55],
  ["ticks", .955, 1.0, 96,  .05,  .50],
  ["arc",   .905, 2.6, .62, -.12, .85],
  ["arc",   .905, 2.6, .18,  .21, .55],
  ["ring",  .845, 0.8, 0,   0,    .30],
  ["ticks", .800, 2.2, 24,  -.08, .65],
  ["arc",   .735, 4.0, .40,  .16, .95],
  ["arc",   .735, 1.4, .78, -.07, .40],
  ["dots",  .655, 2.6, 14,   .10, .80],
  ["ring",  .600, 0.8, 0,   0,    .28],
  ["arc",   .545, 6.0, .30, -.22, 1.0],
  ["ticks", .480, 1.0, 60,   .13, .45],
  ["arc",   .425, 2.0, .55,  .30, .75],
  ["dots",  .360, 1.8, 8,   -.18, .65],
];
let noiseSeed = Math.random() * 1000;

function ease(cur, target, k) { return cur + (target - cur) * k; }

function drawOrb(tms) {
  const t = tms / 1000;
  /* ease live values toward the current state's signature */
  level.speed  = ease(level.speed,  motionTarget.speed,  .06);
  level.energy = ease(level.energy, motionTarget.energy, .08);
  level.pulse  = ease(level.pulse,  motionTarget.pulse,  .08);
  level.sparks = ease(level.sparks, motionTarget.sparks, .10);

  const w = SIZE, cx = w / 2, cy = w / 2;
  const R = w * 0.46;
  const breathe = 1 + Math.sin(t * 2.1) * 0.012 * level.pulse;

  ctx.clearRect(0, 0, w, w);

  /* ambient coal glow floor */
  let g = ctx.createRadialGradient(cx, cy, R * .1, cx, cy, R * 1.05);
  g.addColorStop(0, `rgba(255,107,26,${0.10 * level.energy})`);
  g.addColorStop(.55, `rgba(195,62,0,${0.05 * level.energy})`);
  g.addColorStop(1, "transparent");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, w);

  /* instrument rings */
  for (const [kind, r0, lw, n, sp, alpha] of RINGS) {
    const r = R * r0 * breathe;
    const rot = t * sp * level.speed * Math.PI * 2;
    const hot = alpha * (0.35 + 0.65 * level.energy);
    ctx.lineWidth = lw;

    if (kind === "ring") {
      ctx.strokeStyle = CARBON_RING;
      ctx.globalAlpha = alpha;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    } else if (kind === "ticks") {
      ctx.strokeStyle = CARBON_RING;
      for (let i = 0; i < n; i++) {
        const a = rot + (i / n) * Math.PI * 2;
        const flick = Math.sin(noiseSeed + i * 7.3 + t * 2.4);
        ctx.globalAlpha = alpha * (0.35 + 0.4 * Math.max(0, flick));
        const len = lw > 1.5 ? 7 : 4;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
        ctx.lineTo(cx + Math.cos(a) * (r - len), cy + Math.sin(a) * (r - len));
        ctx.stroke();
      }
    } else if (kind === "arc") {
      ctx.globalAlpha = hot;
      ctx.strokeStyle = lw >= 3 ? EMBER : (lw >= 2 ? EMBER_LO : CARBON_RING);
      ctx.shadowColor = EMBER;
      ctx.shadowBlur = lw >= 3 ? 14 * level.energy : 5 * level.energy;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.arc(cx, cy, r, rot, rot + Math.PI * 2 * n); ctx.stroke();
      ctx.shadowBlur = 0;
    } else if (kind === "dots") {
      ctx.fillStyle = EMBER_HI;
      for (let i = 0; i < n; i++) {
        const a = rot + (i / n) * Math.PI * 2;
        ctx.globalAlpha = hot * (0.4 + 0.6 * Math.abs(Math.sin(t * 1.7 + i)));
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, lw, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  /* thinking sparks: embers orbiting fast between the mid rings */
  const sparkN = Math.round(level.sparks);
  if (sparkN > 0) {
    ctx.fillStyle = EMBER_HI;
    for (let i = 0; i < sparkN; i++) {
      const a = t * (1.3 + (i % 4) * .5) * level.speed * 2 + i * 2.4;
      const rr = R * (0.30 + 0.28 * ((i * 37 % 100) / 100));
      ctx.globalAlpha = .5 + .5 * Math.sin(t * 5 + i * 2);
      ctx.shadowColor = EMBER; ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 1.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  /* asking strobe: the outer ring flashes ember so a pending question is
     visible even from peripheral vision */
  if (motionTarget.strobe) {
    const s = 0.5 + 0.5 * Math.sin(t * 4.2);
    ctx.globalAlpha = .25 + .55 * s;
    ctx.strokeStyle = EMBER; ctx.lineWidth = 2.4;
    ctx.shadowColor = EMBER; ctx.shadowBlur = 22;
    ctx.beginPath(); ctx.arc(cx, cy, R * .995, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  /* molten core */
  const coreR = R * (0.16 + 0.035 * Math.sin(t * 2.6) * level.pulse);
  g = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 2.6);
  g.addColorStop(0, `rgba(255,225,190,${0.95 * level.energy})`);
  g.addColorStop(.25, `rgba(255,176,102,${0.75 * level.energy})`);
  g.addColorStop(.55, `rgba(255,107,26,${0.38 * level.energy})`);
  g.addColorStop(1, "transparent");
  ctx.globalAlpha = 1;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, coreR * 2.6, 0, Math.PI * 2); ctx.fill();
  /* crisp centre */
  ctx.fillStyle = `rgba(255,240,220,${0.75 + 0.25 * level.energy})`;
  ctx.beginPath(); ctx.arc(cx, cy, coreR * .45, 0, Math.PI * 2); ctx.fill();

  ctx.globalAlpha = 1;
  requestAnimationFrame(drawOrb);
}
requestAnimationFrame((t) => { fitCanvas(); drawOrb(t); });

/* ======================================================================
   State + conversation plumbing
   ====================================================================== */
const $ = (id) => document.getElementById(id);
const LABELS = {
  starting:     ["Starting up", true],
  idle:         ["", false],                 // filled with the wake phrase
  listening:    ["Listening", false],
  transcribing: ["Heard you — writing it down", true],
  thinking:     ["Thinking", true],
  working:      ["Working", true],
  speaking:     ["Speaking", false],
  offline:      ["Offline", false],
};
let wakePhrase = "…", currentState = "starting", promptActive = false;

function setState(state, detail) {
  currentState = state;
  const effective = promptActive ? "asking" : state;
  motionTarget = MOTION[effective] || MOTION.idle;

  const label = $("state-label");
  label.classList.toggle("asking", promptActive);
  if (promptActive) {
    label.textContent = "Waiting for your answer";
  } else {
    const [text, dots] = LABELS[state] || ["Working", true];
    label.textContent = state === "idle" ? `Say “${wakePhrase}”` : text;
    label.classList.toggle("dots", !!dots && state !== "idle");
  }
  if (!promptActive) $("state-detail").textContent = detail || "";
  $("offline-veil").classList.toggle("show", state === "offline");
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "you" ? "you" : "jarvis");
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = role === "you" ? "You" : "DP Assistant";
  const body = document.createElement("span");
  body.textContent = text;                       // textContent, always
  div.append(who, body);
  const convo = $("convo");
  convo.insertBefore(div, $("draft"));
  convo.scrollTop = convo.scrollHeight;
}

function setPrompt(prompt) {
  promptActive = !!prompt;
  $("ask-q").textContent = prompt || "";
  $("ask").classList.toggle("show", promptActive);
  if (promptActive) { $("convo").scrollTop = $("convo").scrollHeight; }
  setState(currentState, $("state-detail").textContent);
}

function setDraft(title, text) {
  const show = !!(title || text);
  $("draft-title").textContent = title || "";
  $("draft-body").textContent = text || "";
  $("draft").classList.toggle("show", show);
  if (show) $("convo").scrollTop = $("convo").scrollHeight;
}

function addActivity(a) {
  const row = document.createElement("div");
  row.className = "act" + (a.ok ? "" : " bad");
  const ts = document.createElement("span"); ts.className = "ts"; ts.textContent = a.ts;
  const verb = document.createElement("span"); verb.textContent = a.verb;
  const tool = document.createElement("span"); tool.className = "tool";
  tool.textContent = a.tool || "";
  const det = document.createElement("span"); det.textContent = a.detail || "";
  row.append(ts, verb, tool, det);
  const list = $("act-list");
  list.prepend(row);
  while (list.childElementCount > 80) list.lastChild.remove();
}

/* -- websocket, self-healing ------------------------------------------- */
let ws = null;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "snapshot") {
      wakePhrase = m.wake_phrase || "Hey Jarvis";
      $("wake").textContent = `“${wakePhrase}”`;
      $("act-list").replaceChildren();
      (m.activity || []).forEach(addActivity);
      document.querySelectorAll(".msg").forEach(n => n.remove());
      (m.transcript || []).forEach(x => addMessage(x.role, x.text));
      setDraft((m.draft || {}).title, (m.draft || {}).text);
      setPrompt(m.prompt || "");
      setState(m.state.state, m.state.detail);
    } else if (m.type === "state") setState(m.state, m.detail);
    else if (m.type === "message") addMessage(m.role, m.text);
    else if (m.type === "prompt") setPrompt(m.prompt);
    else if (m.type === "draft") setDraft(m.title, m.text);
    else if (m.type === "activity") addActivity(m);
  };
  ws.onclose = () => { setState("offline", ""); setTimeout(connect, 1500); };
  ws.onerror = () => ws.close();
}
connect();
setInterval(() => { if (ws && ws.readyState === 1) ws.send("ping"); }, 25000);

/* -- controls ----------------------------------------------------------- */
async function post(path, payload) {
  try {
    const r = await fetch(path, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload || {}),
    });
    return r.ok;
  } catch { return false; }
}

$("send").onclick = () => {
  const text = $("say").value.trim();
  if (!text) return;
  $("say").value = "";
  post("/ask", { text });
};
$("say").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").click(); }
});
$("talk").onclick = () => post("/listen");
$("quit").onclick = () => { if (confirm("Stop DP Assistant?")) post("/quit"); };

$("yes").onclick = () => { post("/answer", { answer: "yes" }); setPrompt(""); };
$("no").onclick  = () => { post("/answer", { answer: "no" });  setPrompt(""); };
$("ask-free").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const answer = $("ask-free").value.trim();
    if (!answer) return;
    $("ask-free").value = "";
    post("/answer", { answer });
    setPrompt("");
  }
});
</script>
