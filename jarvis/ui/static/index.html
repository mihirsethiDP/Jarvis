<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jarvis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg0: #070b14; --bg1: #03050a;
    --ink: #d3dcef; --dim: #7a879f; --line: #16203a;
    --warn: #ff6b6b; --good: #45d18a; --accent: #38bdf8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -10%, var(--bg0) 0%, var(--bg1) 65%);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink); overflow: hidden;
    display: grid; grid-template-columns: 1fr minmax(300px, 400px);
  }
  @media (max-width: 880px) {
    body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; overflow: auto; }
    .panel { height: 38vh; border-left: none; border-top: 1px solid var(--line); }
  }

  /* ── the orb ─────────────────────────────────────────────── */
  .stage { position: relative; display: flex; flex-direction: column;
           align-items: center; justify-content: center; min-height: 0; }
  #orb { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .brand { position: absolute; top: 2rem; font-size: .72rem; font-weight: 500;
           letter-spacing: .55em; text-transform: uppercase; color: var(--dim);
           text-indent: .55em; }
  .readout { position: relative; z-index: 2; text-align: center;
             transform: translateY(190px); pointer-events: none; width: 100%; }
  #state { font-size: 1.25rem; font-weight: 600; letter-spacing: .04em;
           transition: color .5s ease; }
  #detail { margin: .55rem auto 0; max-width: 30rem; padding: 0 1.5rem;
            font-size: .86rem; line-height: 1.5; color: var(--dim);
            min-height: 2.6em; }
  .fallback-orb { display: none; width: 190px; height: 190px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff 0%, var(--c,#38bdf8) 30%, #05080f 92%);
    box-shadow: 0 0 70px 10px var(--c,#38bdf8); animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  body.no-webgl #orb { display: none; }
  body.no-webgl .fallback-orb { display: block; }
  body.no-webgl .readout { transform: translateY(24px); }

  /* ── activity ────────────────────────────────────────────── */
  .panel { background: #060a13cc; border-left: 1px solid var(--line);
           display: flex; flex-direction: column; min-height: 0; }
  .panel header { padding: 1rem 1.15rem; border-bottom: 1px solid var(--line);
                  display: flex; align-items: center; justify-content: space-between; }
  .panel h2 { font-size: .72rem; font-weight: 600; letter-spacing: .18em;
              text-transform: uppercase; color: var(--dim); }
  .live { display: flex; align-items: center; gap: .45rem; font-size: .68rem; color: var(--dim); }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good);
            animation: blink 1.8s ease-in-out infinite; }
  .live.down i { background: var(--warn); animation: none; }
  @keyframes blink { 50% { opacity: .2; } }
  #feed { overflow-y: auto; padding: .45rem; flex: 1;
          display: flex; flex-direction: column-reverse; }
  .row { display: grid; grid-template-columns: 3.5rem 1fr; gap: .55rem;
         padding: .5rem .55rem; border-radius: 8px; font-size: .83rem; line-height: 1.45; }
  .row:hover { background: #ffffff08; }
  .row .t { font-variant-numeric: tabular-nums; color: var(--dim); font-size: .74rem; }
  .row b { font-weight: 600; }
  .row .d { color: var(--dim); font-size: .77rem; word-break: break-word; margin-top: .1rem; }
  .badge { display: inline-block; font-size: .64rem; letter-spacing: .05em;
           text-transform: uppercase; padding: .08rem .38rem; border-radius: 4px;
           margin-left: .4rem; border: 1px solid var(--line); color: var(--dim); }
  .row.bad b { color: var(--warn); }
  .row.bad .badge { color: var(--warn); border-color: var(--warn); }
  .row.ok .badge { color: var(--good); border-color: var(--good); }
  .empty { color: var(--dim); font-size: .8rem; text-align: center; padding: 2.5rem 1.2rem; line-height: 1.6; }
  .note { padding: .6rem 1.15rem; border-top: 1px solid var(--line);
          font-size: .68rem; color: var(--dim); letter-spacing: .08em; text-align: center; }
</style>
</head>
<body>
  <main class="stage">
    <div class="brand">Jarvis</div>
    <canvas id="orb"></canvas>
    <div class="fallback-orb"></div>
    <div class="readout">
      <div id="state">connecting…</div>
      <div id="detail"></div>
    </div>
  </main>

  <section class="panel">
    <header>
      <h2>Activity</h2>
      <span class="live" id="live"><i></i><span id="livetext">live</span></span>
    </header>
    <div id="feed"><div class="empty">Nothing yet.<br>Everything Jarvis does appears here as it happens.</div></div>
    <div class="note" id="note">127.0.0.1 only · never leaves this machine</div>
  </section>

<script>
"use strict";

/* Each state gets its own palette and motion. The orb is the only feedback
   you get while talking, so the states have to be told apart at a glance
   and from across a desk — colour alone is not enough, so speed and
   turbulence change too. */
const STATES = {
  starting:     { label: "starting…",           a:[0.35,0.40,0.50], b:[0.55,0.62,0.75], speed:0.30, turb:0.30, gain:0.55, rings:0.0, pulse:0.0 },
  idle:         { label: 'say "Hey Jarvis"',    a:[0.09,0.24,0.62], b:[0.22,0.70,0.95], speed:0.28, turb:0.38, gain:0.80, rings:0.0, pulse:0.0 },
  listening:    { label: "listening…",          a:[0.02,0.55,0.62], b:[0.30,0.92,0.92], speed:0.85, turb:0.62, gain:1.05, rings:1.0, pulse:0.0 },
  transcribing: { label: "transcribing…",       a:[0.35,0.20,0.75], b:[0.68,0.55,0.98], speed:1.05, turb:0.85, gain:0.95, rings:0.35, pulse:0.0 },
  thinking:     { label: "working…",            a:[0.72,0.38,0.03], b:[0.99,0.79,0.25], speed:1.45, turb:1.15, gain:1.00, rings:0.0, pulse:0.0 },
  speaking:     { label: "speaking",            a:[0.03,0.55,0.42], b:[0.30,0.90,0.62], speed:1.00, turb:0.70, gain:1.10, rings:0.0, pulse:1.0 },
  offline:      { label: "offline",             a:[0.30,0.07,0.07], b:[0.65,0.16,0.16], speed:0.12, turb:0.18, gain:0.45, rings:0.0, pulse:0.0 },
};
const cssOf = (s) => `rgb(${STATES[s].b.map(v => Math.round(v * 255)).join(",")})`;

const VERT = `
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FRAG = `
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform vec3  uA;      // deep colour
uniform vec3  uB;      // bright colour
uniform float uSpeed;
uniform float uTurb;
uniform float uGain;
uniform float uRings;  // expanding sonar rings while listening
uniform float uPulse;  // heartbeat while speaking

float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123); }

float noise(vec3 p){
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                 mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                 mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
}

float fbm(vec3 p){
  float v = 0.0, amp = 0.5;
  for (int i = 0; i < 5; i++) { v += amp * noise(p); p *= 2.02; amp *= 0.5; }
  return v;
}

void main(){
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / min(uRes.x, uRes.y);
  float r = length(p);
  float t = uTime * uSpeed;

  // Domain-warped noise gives the surface its slow churn.
  vec3 q  = vec3(p * 2.1, t * 0.22);
  float w = fbm(q * 1.7 + vec3(0.0, 0.0, t * 0.15));
  float n = fbm(q + w * uTurb);

  float radius = 0.185 + uPulse * 0.012 * sin(uTime * 3.4);
  float edge   = radius + n * 0.055 * uTurb;

  // Body, hot core, and the bloom that reads as "lit from inside".
  float body = smoothstep(edge, edge - 0.10, r);
  float core = smoothstep(edge * 0.72, 0.0, r);
  float halo = exp(-max(r - radius, 0.0) * 7.0);
  float rim  = smoothstep(0.045, 0.0, abs(r - edge));

  vec3 col = mix(uA, uB, clamp(n * 1.25, 0.0, 1.0));
  col = mix(col, vec3(1.0), core * 0.72);
  col += uB * rim * 0.55;
  col += uA * halo * 0.40;

  // Sonar rings: only while listening, fading as they travel outward.
  if (uRings > 0.01) {
    float ring = sin((r - uTime * 0.30) * 34.0);
    float band = smoothstep(0.0, 1.0, ring) * smoothstep(0.62, radius, r);
    col += uB * band * 0.10 * uRings;
  }

  float alpha = clamp(body + halo * 0.55 + rim * 0.5, 0.0, 1.0);
  gl_FragColor = vec4(col * uGain, alpha);
}`;

/* ── renderer ──────────────────────────────────────────────── */
const canvas = document.getElementById("orb");
let gl = null, uni = {}, current = { ...STATES.starting }, target = { ...STATES.starting };

function compile(src, type) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}

function initGL() {
  gl = canvas.getContext("webgl", { alpha: true, antialias: true, premultipliedAlpha: false });
  if (!gl) throw new Error("no webgl");
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(VERT, gl.VERTEX_SHADER));
  gl.attachShader(prog, compile(FRAG, gl.FRAGMENT_SHADER));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  ["uRes","uTime","uA","uB","uSpeed","uTurb","uGain","uRings","uPulse"]
    .forEach(n => uni[n] = gl.getUniformLocation(prog, n));
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
    canvas.width = w * dpr; canvas.height = h * dpr;
    if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
  }
}

const lerp = (a, b, k) => a + (b - a) * k;

function frame(ms) {
  resize();
  const k = 0.055;                       // ease between states, never snap
  ["speed","turb","gain","rings","pulse"].forEach(p => current[p] = lerp(current[p], target[p], k));
  ["a","b"].forEach(c => current[c] = current[c].map((v, i) => lerp(v, target[c][i], k)));

  gl.uniform2f(uni.uRes, canvas.width, canvas.height);
  gl.uniform1f(uni.uTime, ms / 1000);
  gl.uniform3fv(uni.uA, current.a);
  gl.uniform3fv(uni.uB, current.b);
  gl.uniform1f(uni.uSpeed, current.speed);
  gl.uniform1f(uni.uTurb, current.turb);
  gl.uniform1f(uni.uGain, current.gain);
  gl.uniform1f(uni.uRings, current.rings);
  gl.uniform1f(uni.uPulse, current.pulse);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}

try {
  initGL();
  requestAnimationFrame(frame);
} catch (e) {
  document.body.classList.add("no-webgl");   // CSS orb still conveys every state
}

/* ── state + activity ──────────────────────────────────────── */
const stateEl = document.getElementById("state");
const detailEl = document.getElementById("detail");
const feedEl = document.getElementById("feed");
const liveEl = document.getElementById("live");
const liveText = document.getElementById("livetext");

function applyState(msg) {
  const key = STATES[msg.state] ? msg.state : "idle";
  target = { ...STATES[key] };
  stateEl.textContent = STATES[key].label;
  stateEl.style.color = cssOf(key);
  document.body.style.setProperty("--c", cssOf(key));
  detailEl.textContent = msg.detail
    ? (msg.state === "thinking" ? "“" + msg.detail + "”" : msg.detail)
    : "";
}

/* Built with textContent throughout. Tool names and details reach this page
   from the audit log, which carries text Jarvis read out of documents, mail
   and chat — none of it can be trusted as markup. */
function addActivity(a, atEnd) {
  const empty = feedEl.querySelector(".empty");
  if (empty) empty.remove();

  const row = document.createElement("div");
  row.className = "row"
    + (a.ok === false ? " bad" : "")
    + (a.decision === "confirmed" || a.decision === "ok" ? " ok" : "");

  const time = document.createElement("div");
  time.className = "t";
  time.textContent = a.ts || "";

  const right = document.createElement("div");
  const what = document.createElement("div");
  what.append(document.createTextNode((a.verb || a.event || "") + " "));
  const tool = document.createElement("b");
  tool.textContent = a.tool || "";
  what.append(tool);
  if (a.decision) {
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = a.decision;
    what.append(badge);
  }
  right.append(what);

  if (a.detail) {
    const d = document.createElement("div");
    d.className = "d";
    d.textContent = a.detail;
    right.append(d);
  }

  row.append(time, right);
  if (atEnd) feedEl.appendChild(row); else feedEl.prepend(row);
}

/* ── live (served by Jarvis) vs demo (static hosting) ──────── */
const LOCAL = location.protocol === "http:"
  && /^(127\.0\.0\.1|localhost|\[::1\])$/.test(location.hostname);

if (LOCAL) {
  let keepalive = null;
  (function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => { liveEl.classList.remove("down"); liveText.textContent = "live"; };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === "snapshot") {
        applyState(m.state || {});
        (m.activity || []).forEach(a => addActivity(a, true));
      } else if (m.type === "activity") {
        addActivity(m, false);
      } else {
        applyState(m);
      }
    };
    ws.onclose = () => {
      applyState({ state: "offline", detail: "Jarvis is not running" });
      liveEl.classList.add("down");
      liveText.textContent = "disconnected";
      clearInterval(keepalive);
      setTimeout(connect, 2000);
    };
    clearInterval(keepalive);
    keepalive = setInterval(() => { if (ws.readyState === 1) ws.send("ping"); }, 20000);
  })();
} else {
  // Static hosting: nothing to connect to, so walk the states on a loop.
  // Deliberately generic — no real names, mail or company data on a public page.
  document.getElementById("note").textContent = "DEMO · the real orb runs on your own machine";
  liveText.textContent = "demo";
  const script = [
    { state: "idle",         detail: "",                                            wait: 3200 },
    { state: "listening",    detail: "",                                            wait: 2600 },
    { state: "transcribing", detail: "",                                            wait: 1200 },
    { state: "thinking",     detail: "kal ki meeting kis time par hai?",             wait: 2600,
      act: { ts: "10:24:02", verb: "used", tool: "list_calendar_events", decision: "ok" } },
    { state: "speaking",     detail: "Tomorrow you have two meetings — 11:00 and 15:30.", wait: 3400 },
    { state: "idle",         detail: "",                                            wait: 2400 },
    { state: "listening",    detail: "",                                            wait: 2200 },
    { state: "thinking",     detail: "send that summary to the plant lead",          wait: 2200,
      act: { ts: "10:25:41", verb: "asked you to confirm", tool: "send_email", decision: "confirmed" } },
    { state: "speaking",     detail: "Sent.",                                       wait: 2200,
      act: { ts: "10:25:44", verb: "used", tool: "send_email", decision: "ok" } },
  ];
  let i = 0;
  (function step() {
    const s = script[i % script.length];
    applyState(s);
    if (s.act) addActivity({ ...s.act, ok: true }, false);
    i++;
    setTimeout(step, s.wait);
  })();
}
</script>
</body>
</html>
